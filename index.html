<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08050d">
  <meta name="description" content="A Christmas greeting with a rotating pink tree and falling snow.">
  <title>Merry Christmas 潘嘉彬</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; color: #fff0f7; background: #08050d; }
    main { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    h1 {
      position: absolute; top: 32%; left: 5%; margin: 0;
      font: italic 400 clamp(1.3rem, 3.2vw, 3.5rem)/1.1 Georgia, serif;
      text-shadow: 0 0 1.2em #fc7dc888; pointer-events: none;
    }
    h1 span {
      display: block; margin-top: .6em; font-size: .6em; font-style: normal;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; letter-spacing: .16em;
    }
    @media (max-width: 720px) and (orientation: portrait) {
      h1 { top: 7%; left: 0; width: 100%; text-align: center; font-size: clamp(1.65rem, 7vw, 3rem); }
    }
  </style>
</head>
<body>
  <!-- A personalized web greeting for shunading-commits, built with AI assistance.
       Visual inspiration: https://github.com/ZekangLi-Zico/Christmas-Tree -->
  <main>
    <canvas role="img" aria-label="Pink Christmas lights, a heart topper, and falling snow"></canvas>
    <h1>Merry Christmas<span lang="zh-Hans">潘嘉彬</span></h1>
  </main>
  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const tau = 2 * Math.PI;
    const random = Math.random;
    const palette = ['#6d234e', '#a54473', '#e679a9', '#ffaacf', '#ffdded', '#fff4fa', '#9687bd', '#c4aedc'];
    const layers = Array.from({ length: palette.length }, () => []);
    const pitch = .18;
    const tiltSin = Math.sin(pitch);
    const tiltCos = Math.cos(pitch);

    function ringPoint(layer, radius, angle, y, size) {
      layers[layer].push({ x: radius * Math.cos(angle), y, z: radius * Math.sin(angle), size });
    }

    // Tapered branches with a brighter ribbon climbing around the tree.
    for (let n = 0; n < 13000; n++) {
      const level = random() ** 1.4;
      const tier = (level * 7) % 1;
      const radius = 3.4 * (1 - level) * (1 - .24 * tier);
      const ribbon = n % 5 < 2;
      const angle = ribbon ? level * 10 * tau + (random() - .5) * .56 : random() * tau;
      const distance = ribbon ? radius * (.92 + .19 * random()) : radius * (.2 + .8 * Math.sqrt(random()));
      const shade = ribbon ? 2 + Math.floor(random() * 4) : Math.floor(random() * 4);
      ringPoint(shade, distance, angle, level * 8 + (random() - .5) * .13, .45 + .82 * random());
    }

    for (let band = 0; band < 5; band++) {
      for (let n = 0; n < 270; n++) {
        ringPoint(6 + (n % 5 === 0 ? 1 : 0), 3.9 + band * .63 + (random() - .5) * .2,
          random() * tau, -.18, .55 + .7 * random());
      }
    }

    // Sample a parametric heart and lightly fill its center.
    for (let n = 0; n < 950; n++) {
      const t = random() * tau;
      const fill = Math.sqrt(random());
      const x = .052 * 16 * Math.sin(t) ** 3;
      const y = .052 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      layers[3 + n % 3].push({ x: x * fill, y: 8.78 + y * fill, z: (random() - .5) * .26, size: 1.2 });
    }

    const snow = Array.from({ length: 58 }, () => ({
      x: random(), y: random(), phase: random() * tau,
      size: .6 + random() ** 3 * 3.4, speed: .013 + random() * .037,
      opacity: .22 + random() * .62,
    }));
    let width, height, focal, centerX, centerY, background;
    let lastTime = 0, elapsed = 0, frame;

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      width = bounds.width;
      height = bounds.height;
      const scale = Math.min(devicePixelRatio || 1, 1.65);
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      focal = Math.min(height * .87, width * 1.19);
      centerX = width * (width < 720 ? .5 : .55);
      centerY = height * (width < 720 && height > width ? .55 : .51);
      background = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * .62);
      background.addColorStop(0, '#1b0b1d');
      background.addColorStop(1, '#08050d');
      draw(0);
    }

    function draw(delta) {
      elapsed += delta;
      ctx.globalAlpha = 1;
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, width, height);
      const sin = Math.sin(elapsed * .32);
      const cos = Math.cos(elapsed * .32);

      for (const [shade, points] of layers.entries()) {
        ctx.fillStyle = palette[shade];
        for (const point of points) {
          const x = point.x * cos - point.z * sin;
          const z = point.x * sin + point.z * cos;
          const y = point.y - 4.25;
          const depth = 12.8 + z * tiltCos - y * tiltSin;
          const scale = focal / depth;
          const screenX = centerX + x * scale;
          const screenY = centerY - (y * tiltCos + z * tiltSin) * scale;
          const size = Math.max(.55, point.size * Math.min(1.65, scale / 52));
          ctx.fillRect(screenX - size / 2, screenY - size / 2, size, size);
        }
      }

      ctx.fillStyle = '#fff8ff';
      for (const flake of snow) {
        flake.y = (flake.y + flake.speed * delta) % 1.05;
        const x = flake.x * width + 13 * Math.sin(flake.phase + elapsed * .66);
        const y = flake.y * height;
        ctx.globalAlpha = flake.opacity;
        ctx.beginPath();
        ctx.arc(x, y, flake.size, 0, tau);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function animate(time) {
      draw(lastTime ? Math.min((time - lastTime) / 1000, .05) : 0);
      lastTime = time;
      frame = requestAnimationFrame(animate);
    }

    function updateMotion() {
      cancelAnimationFrame(frame);
      lastTime = 0;
      if (!motion.matches && !document.hidden) frame = requestAnimationFrame(animate);
    }

    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', updateMotion);
    motion.addEventListener('change', updateMotion);
    resize();
    updateMotion();
  </script>
</body>
</html>
