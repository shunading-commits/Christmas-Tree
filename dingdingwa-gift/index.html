<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100815">
<title>制作圣诞树礼物</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #fff0f7; background: #100815; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: clamp(16px, 5vw, 64px); background: radial-gradient(ellipse at 20% 10%, #301329, transparent 60%), #100815; }
  [hidden] { display: none !important; }
  main { width: min(100%, 1080px); display: grid; grid-template-columns: 1.15fr 1fr; overflow: hidden; border: 1px solid #694460; border-radius: 25px; background: #201020; box-shadow: 0 20px 65px #0006; }
  iframe { display: block; border: 0; width: 100%; height: 100%; min-height: 520px; background: #08050d; }
  section { align-self: center; padding: clamp(22px, 4vw, 52px); }
  h1 { font-family: Georgia, "Songti SC", SimSun, serif; font-size: clamp(1.95rem,4vw,3rem); line-height: 1.15; margin: 0 0 13px; letter-spacing: -.035em; }
  p { line-height: 1.55; }
  .intro { color: #e1bcd1; margin: 0 0 26px; }
  label { display: block; margin-bottom: 8px; font-weight: 650; }
  input[type=text], input[type=url] { width: 100%; font: inherit; color: inherit; border: 1px solid #815473; border-radius: 11px; background: #170c19; padding: 12px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .field { margin-bottom: 19px; }
  .upload { display: flex; align-items: center; gap: 12px; border: 1px dashed #ad7198; border-radius: 11px; background: #2b162a; padding: 12px; min-height: 59px; cursor: pointer; margin: 0; }
  .upload:focus-within, :focus-visible { outline: 2px solid #ffc3e7; outline-offset: 3px; }
  .upload img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
  #file-label { overflow-wrap: anywhere; }
  button, .secondary { font: 650 1rem system-ui, sans-serif; cursor: pointer; padding: 12px 16px; border-radius: 11px; border: 1px solid transparent; text-align: center; }
  .primary { width: 100%; background: #fcc0e2; color: #351829; }
  .primary:hover { background: #ffd6ee; }
  .primary:disabled { opacity: .65; cursor: wait; }
  .secondary { background: transparent; color: #ffe2f2; border-color: #815473; text-decoration: none; }
  .privacy, #status { font-size: .875rem; color: #e1bcd1; margin: 9px 0 0; }
  #status { color: #ffd59d; }
  #result { border-top: 1px solid #694460; margin-top: 21px; padding-top: 17px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  @media (max-width: 760px) {
    body { padding: 14px; }
    main { grid-template-columns: 1fr; }
    iframe { height: min(46vh, 450px); min-height: 270px; }
  }
</style>
<body>
<main>
  <iframe src="/scene" title="圣诞树效果预览"></iframe>
  <section aria-labelledby="heading">
    <h1 id="heading">送一棵圣诞树</h1>
    <p class="intro">给对方写上名字，再把一张照片藏进树下的礼物盒。</p>
    <form>
      <div class="field">
        <label for="name">收礼人的名字</label>
        <input id="name" type="text" maxlength="40" placeholder="输入名字或昵称" required>
      </div>
      <div class="field">
        <label id="photo-label" for="photo">礼物照片</label>
        <label class="upload">
          <input id="photo" type="file" accept="image/*" aria-labelledby="photo-label" required>
          <img id="thumbnail" alt="" hidden>
          <span id="file-label">选择一张照片</span>
        </label>
      </div>
      <button class="primary" type="submit">生成收礼链接</button>
      <p class="privacy">拿到收礼链接的人可以打开礼物。</p>
    </form>
    <p id="status" role="status" hidden></p>
    <div id="result" hidden>
      <label for="link">收礼链接</label>
      <input id="link" type="url" readonly>
      <div class="actions">
        <button class="secondary" id="copy" type="button">复制链接</button>
        <a class="secondary" id="open" target="_blank" rel="noopener">查看收礼页</a>
      </div>
    </div>
  </section>
</main>
<script>
  const form = document.querySelector('form');
  const nameInput = document.querySelector('#name');
  const photoInput = document.querySelector('#photo');
  const preview = document.querySelector('iframe');
  const thumbnail = document.querySelector('#thumbnail');
  const submit = form.querySelector('button');
  const status = document.querySelector('#status');
  const result = document.querySelector('#result');
  const link = document.querySelector('#link');
  let thumbnailUrl;

  function showStatus(message) {
    status.textContent = message;
    status.hidden = !message;
  }
  function updateName() {
    const name = nameInput.value.trim();
    nameInput.setCustomValidity('');
    try { preview.contentWindow.postMessage({ name }, location.origin); } catch {}
  }
  function resetResult() {
    result.hidden = true;
    if (!submit.disabled) showStatus('');
  }
  nameInput.addEventListener('input', () => { updateName(); resetResult(); });
  preview.addEventListener('load', updateName);
  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (thumbnailUrl) URL.revokeObjectURL(thumbnailUrl);
    thumbnailUrl = file ? URL.createObjectURL(file) : '';
    if (thumbnailUrl) thumbnail.src = thumbnailUrl;
    else thumbnail.removeAttribute('src');
    thumbnail.hidden = !thumbnailUrl;
    document.querySelector('#file-label').textContent = file?.name || '选择一张照片';
    resetResult();
  });
  thumbnail.onerror = () => { thumbnail.hidden = true; };

  async function compressPhoto(file) {
    if (file.size > 24 * 1024 * 1024) throw new Error('请选择小于 24 MB 的照片。');
    const url = URL.createObjectURL(file);
    const image = new Image();
    try {
      image.src = url;
      try { await image.decode(); }
      catch { throw new Error('这张照片无法读取，请试试 JPG、PNG 或 WebP。'); }
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      for (const dimension of [1600, 1100, 760]) {
        const scale = Math.min(1, dimension / Math.max(image.naturalWidth, image.naturalHeight));
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        ctx.fillStyle = '#fff4fa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .83));
        if (blob?.size && blob.size <= 800000) return blob;
      }
      throw new Error('这张照片太大，请换一张较小的照片。');
    } finally { URL.revokeObjectURL(url); }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (submit.disabled) return;
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.setCustomValidity('请输入收礼人的名字。');
      nameInput.reportValidity();
      return;
    }
    const file = photoInput.files[0];
    submit.disabled = nameInput.disabled = photoInput.disabled = true;
    result.hidden = true;
    showStatus('正在制作礼物…');
    try {
      const photo = await compressPhoto(file);
      const response = await fetch('/api/gifts', {
        method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'X-Recipient': encodeURIComponent(name) }, body: photo
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !/^[a-f0-9]{32}$/.test(data.id)) throw new Error(data.error || '生成失败，请稍后重试。');
      link.value = new URL('/gift/' + data.id, location.href).href;
      document.querySelector('#open').href = link.value;
      result.hidden = false;
      showStatus('');
    } catch (error) {
      showStatus(error instanceof TypeError ? '连接失败，请检查网络后重试。' : error.message);
    } finally {
      submit.disabled = nameInput.disabled = photoInput.disabled = false;
    }
  });
  document.querySelector('#copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(link.value);
      showStatus('已复制收礼链接。');
    } catch {
      link.focus();
      link.select();
      showStatus('链接已选中，可以手动复制。');
    }
  });
</script>
</body>
</html>
