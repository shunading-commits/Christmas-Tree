<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08050d">
  <meta name="description" content="A Christmas greeting with a rotating pink tree and falling snow.">
  <title>Merry Christmas · 圣诞树礼物</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; color: #fff0f7; background: #08050d; }
    main { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    h1 {
      position: absolute; top: 32%; left: 5%; margin: 0;
      font: italic 400 clamp(1.3rem, 3.2vw, 3.5rem)/1.1 Georgia, "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", SimSun, serif;
      text-shadow: 0 0 1.2em #fc7dc888; pointer-events: none;
    }
    h1 span {
      display: block; margin-top: .6em; font-size: .6em; letter-spacing: .06em; overflow-wrap: anywhere;
    }
    @media (max-width: 720px) and (orientation: portrait) {
      h1 { top: 7%; left: 0; width: 100%; text-align: center; font-size: clamp(1.65rem, 7vw, 3rem); }
    }

    .gift {
      position: absolute; z-index: 1; left: clamp(38px, var(--gift-x, 33%), calc(100% - 38px));
      top: clamp(76px, var(--gift-y, 81%), calc(100% - 38px)); transform: translate(-50%, -50%);
      display: grid; justify-items: center; width: 76px; min-height: 74px; padding: 0; border: 0;
      background: none; color: #f9d0e5; cursor: pointer; isolation: isolate;
    }
    .gift:focus-visible, .close:focus-visible { outline: 2px solid #fff0f7; outline-offset: 4px; border-radius: 8px; }
    .tag {
      position: relative; z-index: 1; grid-area: 1 / 1; align-self: start; margin-top: -1px; white-space: nowrap;
      padding: 0 8px; color: inherit; font: 500 14px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: .12em; text-indent: .12em; text-shadow: 0 0 8px #ed82bd, 0 1px 4px #190817;
    }
    .tag::before, .tag::after {
      content: ""; position: absolute; top: 48%; width: 2px; height: 2px; border-radius: 50%;
      background: #fac4df; box-shadow: 0 0 5px #ffc2e4;
    }
    .tag::before { left: 0; }
    .tag::after { right: 0; }
    .box { grid-area: 1 / 1; align-self: end; position: relative; display: block; width: 70px; height: 61px; }
    .box::before {
      content: ""; position: absolute; inset: 77% 0 1%; border-radius: 50%;
      background: radial-gradient(ellipse, #e68fb856, #a6549b20 45%, transparent 72%);
      transform: translateY(-1px);
    }
    .gift-base, .lid { position: absolute; inset: 0; width: 100%; height: 100%; }
    .lid { transform-origin: 18% 56%; transition: transform .39s cubic-bezier(.19,.73,.29,1.1); }
    .gift:not(:disabled):hover .tag, .gift:focus-visible .tag { color: #fff2fa; }
    .gift[aria-expanded="true"] .lid { transform: translate(-4px,-11px) rotate(-26deg); }
    dialog { box-sizing: border-box; width: min(92vw, 630px); max-height: 90vh; max-height: 90dvh; background: #1b0c1e; color: #fff0f7; border: 1px solid #aa538a; border-radius: 18px; padding: 46px 12px 12px; box-shadow: 0 14px 70px #000b; }
    dialog[open] { animation: reveal .34s ease-out both; }
    dialog::backdrop { background: #090411cf; }
    dialog img { display: block; max-width: 100%; max-height: calc(90vh - 114px); max-height: calc(90dvh - 114px); object-fit: contain; margin: auto; border-radius: 9px; }
    dialog [hidden] { display: none !important; }
    .send-gift {
      display: flex; align-items: center; min-height: 44px; width: fit-content; box-sizing: border-box;
      margin: 8px auto 0; padding: 0 15px; border-radius: 10px; color: #f6c6e3;
      font: 500 14px/1.3 system-ui, sans-serif; text-decoration: none;
    }
    .send-gift:hover { background: #44233f; color: #fff0f7; }
    .send-gift:focus-visible { outline: 2px solid #f6c6e3; outline-offset: -2px; }
    .close { position: absolute; right: 9px; top: 7px; background: #41223e; border: 0; border-radius: 50%; color: white; min-width: 34px; min-height: 34px; font-size: 23px; cursor: pointer; }
    .photo-status { margin: 12px; text-align: center; font: 16px system-ui, sans-serif; }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px) scale(.95); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .lid { transition: none; } dialog[open] { animation: none; } }
  </style>
</head>
<body>
  <main>
    <canvas role="img" aria-label="Pink Christmas lights, a heart topper, and falling snow"></canvas>
    <h1>Merry Christmas<span lang="zh-Hans">%%RECIPIENT%%</span></h1>

    <button class="gift" type="button" aria-label="打开礼物" aria-haspopup="dialog" aria-expanded="false">
      <span class="tag">点我</span><span class="box" aria-hidden="true"><canvas class="gift-base"></canvas><canvas class="lid"></canvas></span>
    </button>
    <dialog aria-label="礼物照片">
      <button class="close" type="button" aria-label="关闭礼物照片">×</button>
      <p class="photo-status" role="status" hidden></p>
      <img alt="送给你的圣诞礼物照片" hidden>
      <a class="send-gift" href="/" hidden>我也送一份</a>
    </dialog>
  </main>
  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const tau = 2 * Math.PI;
    const random = Math.random;
    const palette = ['#6d234e', '#a54473', '#e679a9', '#ffaacf', '#ffdded', '#fff4fa', '#9687bd', '#c4aedc'];
    const layers = Array.from({ length: palette.length }, () => []);
    const pitch = .18;
    const tiltSin = Math.sin(pitch);
    const tiltCos = Math.cos(pitch);

    function ringPoint(layer, radius, angle, y, size) {
      layers[layer].push({ x: radius * Math.cos(angle), y, z: radius * Math.sin(angle), size });
    }

    // Tapered branches with a brighter ribbon climbing around the tree.
    for (let n = 0; n < 13000; n++) {
      const level = random() ** 1.4;
      const tier = (level * 7) % 1;
      const radius = 3.4 * (1 - level) * (1 - .24 * tier);
      const ribbon = n % 5 < 2;
      const angle = ribbon ? level * 10 * tau + (random() - .5) * .56 : random() * tau;
      const distance = ribbon ? radius * (.92 + .19 * random()) : radius * (.2 + .8 * Math.sqrt(random()));
      const shade = ribbon ? 2 + Math.floor(random() * 4) : Math.floor(random() * 4);
      ringPoint(shade, distance, angle, level * 8 + (random() - .5) * .13, .45 + .82 * random());
    }

    for (let band = 0; band < 5; band++) {
      for (let n = 0; n < 270; n++) {
        ringPoint(6 + (n % 5 === 0 ? 1 : 0), 3.9 + band * .63 + (random() - .5) * .2,
          random() * tau, -.18, .55 + .7 * random());
      }
    }

    // Sample a parametric heart and lightly fill its center.
    for (let n = 0; n < 950; n++) {
      const t = random() * tau;
      const fill = Math.sqrt(random());
      const x = .052 * 16 * Math.sin(t) ** 3;
      const y = .052 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      layers[3 + n % 3].push({ x: x * fill, y: 8.78 + y * fill, z: (random() - .5) * .26, size: 1.2 });
    }

    const snow = Array.from({ length: 58 }, () => ({
      x: random(), y: random(), phase: random() * tau,
      size: .6 + random() ** 3 * 3.4, speed: .013 + random() * .037,
      opacity: .22 + random() * .62,
    }));
    let width, height, focal, centerX, centerY, background;
    let lastTime = 0, elapsed = 0, frame;

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      width = bounds.width;
      height = bounds.height;
      const scale = Math.min(devicePixelRatio || 1, 1.65);
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      focal = Math.min(height * .87, width * 1.19);
      centerX = width * (width < 720 ? .5 : .55);
      centerY = height * (width < 720 && height > width ? .55 : .51);
      background = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * .62);
      background.addColorStop(0, '#1b0b1d');
      background.addColorStop(1, '#08050d');
      canvas.parentElement.style.setProperty('--gift-x', (centerX - focal * .23) + 'px');
      canvas.parentElement.style.setProperty('--gift-y', (centerY + focal * .365) + 'px');
      draw(0);
    }

    function draw(delta) {
      elapsed += delta;
      ctx.globalAlpha = 1;
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, width, height);
      const angle = elapsed * .32;
      const sin = Math.sin(angle);
      const cos = Math.cos(angle);
      if (elapsed - lastGiftArtAt >= 1 / 25) {
        renderGift(angle + .55);
        lastGiftArtAt = elapsed;
      }

      for (const [shade, points] of layers.entries()) {
        ctx.fillStyle = palette[shade];
        for (const point of points) {
          const x = point.x * cos - point.z * sin;
          const z = point.x * sin + point.z * cos;
          const y = point.y - 4.25;
          const depth = 12.8 + z * tiltCos - y * tiltSin;
          const scale = focal / depth;
          const screenX = centerX + x * scale;
          const screenY = centerY - (y * tiltCos + z * tiltSin) * scale;
          const size = Math.max(.55, point.size * Math.min(1.65, scale / 52));
          ctx.fillRect(screenX - size / 2, screenY - size / 2, size, size);
        }
      }

      ctx.fillStyle = '#fff8ff';
      for (const flake of snow) {
        flake.y = (flake.y + flake.speed * delta) % 1.05;
        const x = flake.x * width + 13 * Math.sin(flake.phase + elapsed * .66);
        const y = flake.y * height;
        ctx.globalAlpha = flake.opacity;
        ctx.beginPath();
        ctx.arc(x, y, flake.size, 0, tau);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function animate(time) {
      draw(lastTime ? Math.min((time - lastTime) / 1000, .05) : 0);
      lastTime = time;
      frame = requestAnimationFrame(animate);
    }

    function updateMotion() {
      cancelAnimationFrame(frame);
      lastTime = 0;
      if (!motion.matches && !document.hidden) frame = requestAnimationFrame(animate);
    }


    function createGiftRenderer(base, cover) {
      const ratio = Math.min(devicePixelRatio || 1, 3);
      const width = 70;
      const height = 61;
      const [body, lid] = [base, cover].map(layer => {
        layer.width = Math.round(width * ratio);
        layer.height = Math.round(height * ratio);
        const ink = layer.getContext('2d');
        ink.scale(layer.width / 76, layer.height / 66);
        return ink;
      });

      const shades = ['#a94c84', '#e679a9', '#ffaacf', '#ffdded', '#fff4fa'];
      let seed = 17429;
      function sparkle() {
        seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
        return seed / 4294967296;
      }
      function fleck(ink, x, y, strength) {
        const size = .35 + sparkle() * 1.12;
        ink.fillStyle = shades[Math.floor(sparkle() * shades.length)];
        ink.globalAlpha = strength * (.35 + sparkle() * .65);
        ink.fillRect(x, y, size, size);
      }
      function facet(ink, corners, light, shadow, density) {
        const [a, b, c, d] = corners;
        ink.beginPath();
        ink.moveTo(...a);
        for (const point of [b, c, d]) ink.lineTo(...point);
        ink.closePath();
        const paint = ink.createLinearGradient(...a, ...c);
        paint.addColorStop(0, light);
        paint.addColorStop(1, shadow);
        ink.fillStyle = paint;
        ink.fill();
        ink.strokeStyle = '#e5a1c584';
        ink.lineWidth = .5;
        ink.stroke();

        ink.save();
        ink.clip();
        for (let n = 0; n < density; n++) {
          const u = sparkle();
          const v = sparkle();
          const x = (a[0] * (1 - u) + b[0] * u) * (1 - v) + (d[0] * (1 - u) + c[0] * u) * v;
          const y = (a[1] * (1 - u) + b[1] * u) * (1 - v) + (d[1] * (1 - u) + c[1] * u) * v;
          fleck(ink, x, y, .58);
        }
        ink.restore();
      }
      function edge(ink, start, end, count) {
        ink.save();
        ink.shadowColor = '#ea8dc3';
        ink.shadowBlur = 3;
        for (let n = 0; n < count; n++) {
          const t = sparkle();
          fleck(ink, start[0] + (end[0] - start[0]) * t + (sparkle() - .5) * 1.7,
            start[1] + (end[1] - start[1]) * t + (sparkle() - .5) * 1.7, .9);
        }
        ink.restore();
      }

      function drawWalls(ink, project, halfWidth, halfDepth, bottom, top, lights, density, visible) {
        const rim = [[-halfWidth, halfDepth], [halfWidth, halfDepth], [halfWidth, -halfDepth], [-halfWidth, -halfDepth]];
        for (const [index, [x1, z1]] of rim.entries()) {
          if (visible[index] <= 0) continue;
          const [x2, z2] = rim[(index + 1) % rim.length];
          const a = project(x1, top, z1);
          const b = project(x2, top, z2);
          const c = project(x2, bottom, z2);
          const d = project(x1, bottom, z1);
          seed = 17429 + index * 729 + bottom * 149;
          facet(ink, [a, b, c, d], lights[index % 2], lights[2], density);
          const left = (x1, x2) => x1 + (x2 - x1) * .43;
          const right = (x1, x2) => x1 + (x2 - x1) * .57;
          const rx1 = left(x1, x2), rz1 = left(z1, z2);
          const rx2 = right(x1, x2), rz2 = right(z1, z2);
          facet(ink, [project(rx1, top, rz1), project(rx2, top, rz2),
            project(rx2, bottom, rz2), project(rx1, bottom, rz1)], '#ffe0f0ce', '#bd699fa8', 10);
          edge(ink, d, c, 25);
          edge(ink, a, d, 14);
        }
      }

      const bodyLights = ['#b76394b0', '#a95c9ba8', '#402245d9'];
      const lidLights = ['#e79cc6db', '#ca78a7d9', '#a8629cdd'];
      return (angle) => {
        const sin = Math.sin(angle);
        const cos = Math.cos(angle);
        const visible = [cos, sin, -cos, -sin];

        function project(x, y, z) {
          const depth = x * sin + z * cos;
          return [38 + x * cos - z * sin, 54 - y * .88 + depth * .31];
        }
        function topFace(ink, w, d, y, light, shadow, density) {
          const rim = [project(-w,y,d), project(w,y,d), project(w,y,-d), project(-w,y,-d)];
          facet(ink, rim, light, shadow, density);
          return rim;
        }

        body.clearRect(0, 0, 76, 66);
        lid.clearRect(0, 0, 76, 66);
        drawWalls(body, project, 21, 16, 0, 23, bodyLights, 59, visible);
        seed = 4915;
        topFace(body, 21, 16, 23, '#b56d9ac4', '#271229ee', 37);

        drawWalls(lid, project, 23, 18, 23, 29, lidLights, 35, visible);
        seed = 8137;
        const top = topFace(lid, 23, 18, 29, '#f2aacddd', '#a15f9ac2', 78);
        topFace(lid, 3, 18, 29, '#ffe2f1d9', '#da84b2be', 18);
        topFace(lid, 23, 2.5, 29, '#ffe2f1ca', '#da84b2b0', 18);
        for (const [index, point] of top.entries()) {
          edge(lid, point, top[(index + 1) % top.length], 22);
        }

        lid.save();
        lid.strokeStyle = '#f7bbdb';
        lid.lineWidth = 1.15;
        lid.lineCap = 'round';
        lid.shadowColor = '#ee89bd';
        lid.shadowBlur = 4;
        const knot = project(0, 30, 0);
        lid.beginPath();
        lid.moveTo(...knot);
        lid.bezierCurveTo(...project(-8, 34, 4), ...project(-16, 42, 5), ...project(-12, 43, -1));
        lid.bezierCurveTo(...project(-7, 45, -5), ...project(-2, 38, -4), ...knot);
        lid.bezierCurveTo(...project(5, 39, 4), ...project(13, 45, 5), ...project(15, 42, -1));
        lid.bezierCurveTo(...project(18, 38, -5), ...project(7, 33, -3), ...knot);
        lid.bezierCurveTo(...project(3, 30, 3), ...project(6, 29, 7), ...project(10, 29, 10));
        lid.moveTo(...knot);
        lid.bezierCurveTo(...project(-3, 31, 2), ...project(-5, 29, 6), ...project(-8, 29, 10));
        lid.stroke();
        lid.fillStyle = '#ffe4f2';
        lid.beginPath();
        lid.arc(...knot, 1.35, 0, tau);
        lid.fill();
        lid.restore();
      };
    }

    const gift = document.querySelector('.gift');
    const renderGift = createGiftRenderer(gift.querySelector('.gift-base'), gift.querySelector('.lid'));
    let lastGiftArtAt = -Infinity;
    const dialog = document.querySelector('dialog');
    const photo = dialog.querySelector('img');
    const status = dialog.querySelector('.photo-status');
    const sendGift = dialog.querySelector('.send-gift');
    const greeting = document.querySelector('h1 span');
    const preview = location.pathname === '/scene';
    if (preview) {
      addEventListener('message', (event) => {
        if (event.origin === location.origin && event.source === parent && typeof event.data?.name === 'string') {
          greeting.textContent = event.data.name.slice(0, 40) || '你想送礼物的人';
        }
      });
      gift.disabled = true;
      gift.style.cursor = 'default';
    }
    gift.addEventListener('click', () => {
      if (gift.getAttribute('aria-expanded') === 'true') return;
      gift.setAttribute('aria-expanded', 'true');
      setTimeout(() => {
        dialog.showModal();
        if (photo.complete && photo.naturalWidth) {
          revealPhoto();
          return;
        }
        photo.hidden = true;
        sendGift.hidden = true;
        status.textContent = '正在打开照片…';
        status.hidden = false;
        photo.src = location.pathname + '/photo';
      }, motion.matches ? 0 : 340);
    });
    function revealPhoto() {
      status.hidden = true;
      photo.hidden = false;
      sendGift.hidden = false;
    }
    photo.onload = revealPhoto;
    photo.onerror = () => {
      photo.hidden = true;
      sendGift.hidden = true;
      photo.removeAttribute('src');
      status.textContent = '照片加载失败，关闭礼物后可以再试一次。';
    };
    dialog.querySelector('.close').onclick = () => dialog.close();
    dialog.addEventListener('click', (event) => { if (event.target === dialog) {
      const rect = dialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
    } });
    dialog.addEventListener('close', () => {
      gift.setAttribute('aria-expanded', 'false');
      gift.focus();
    });

    addEventListener('resize', resize);
    document.addEventListener('visibilitychange', updateMotion);
    motion.addEventListener('change', updateMotion);
    resize();
    updateMotion();
  </script>
</body>
</html>
